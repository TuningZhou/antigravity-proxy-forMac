name: Release (macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（示例：1.2 或 1.2.3）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build Universal2 (macOS)
    runs-on: macos-14
    timeout-minutes: 30

    outputs:
      release_tag: ${{ steps.prepare_version.outputs.release_tag }}
      release_version: ${{ steps.prepare_version.outputs.release_version }}

    steps:
    - name: 检出仓库
      uses: actions/checkout@v6

    - name: 准备版本号
      id: prepare_version
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          rawVersion="$INPUT_VERSION"
          normalized="${rawVersion#v}"
          tag="v$normalized"
        else
          tag="$REF_NAME"
          normalized="${tag#v}"
        fi
        if ! [[ "$normalized" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
          echo "发布版本格式错误: $normalized（应为 1.2 或 1.2.3）" >&2
          exit 1
        fi
        echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
        echo "release_version=$normalized" >> "$GITHUB_OUTPUT"

    - name: 同步版本号到 VERSION
      shell: bash
      env:
        RELEASE_VERSION: ${{ steps.prepare_version.outputs.release_version }}
      run: |
        echo "$RELEASE_VERSION" > VERSION
        echo "已同步 VERSION: $RELEASE_VERSION"

    - name: 编译、测试并打包 Universal2 预编译包
      shell: bash
      env:
        RELEASE_VERSION: ${{ steps.prepare_version.outputs.release_version }}
        RELEASE_TAG: ${{ steps.prepare_version.outputs.release_tag }}
      run: |
        ./scripts/package-mac.sh --version "${RELEASE_VERSION}" --arch universal
        cd dist
        shasum -a 256 *.zip > "antigravity-proxy-${RELEASE_TAG}-mac-universal2.zip.sha256"

    - name: 上传构建产物
      uses: actions/upload-artifact@v7
      with:
        name: release-assets-mac
        path: |
          dist/*.zip
          dist/*.sha256
        if-no-files-found: error
        retention-days: 1

  release:
    name: 发布 GitHub Release
    needs: build-mac
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 检出仓库
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: 生成发布说明
      id: changelog
      shell: bash
      run: |
        set -euo pipefail
        CURRENT_TAG="${{ needs.build-mac.outputs.release_tag }}"
        
        PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)
        
        if [ -z "${PREV_TAG:-}" ]; then
          COMMIT_RANGE="HEAD"
        else
          COMMIT_RANGE="${PREV_TAG}..HEAD"
        fi
        
        trim() {
          local s="$1"
          s="${s//$'\r'/}"
          s="$(printf '%s' "$s" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          printf '%s' "$s"
        }
        
        strip_inline_fence() {
          local s
          local fence='```'
          s="$(trim "$1")"
          if [[ "$s" == "$fence"* ]]; then
            s="${s#"$fence"}"
            s="$(trim "$s")"
            if [[ "$s" =~ ^[[:alnum:]_-]+$ ]]; then
              s=""
            elif [[ "$s" =~ ^[[:alnum:]_-]+[[:space:]]+(.*)$ ]]; then
              s="$(trim "${BASH_REMATCH[1]}")"
            fi
          fi
          if [[ "$s" == *"$fence" ]]; then
            s="${s%"$fence"}"
            s="$(trim "$s")"
          fi
          printf '%s' "$s"
        }
        
        md_escape_backticks() {
          local s="$1"
          local tick='`'
          s="${s//${tick}/\\${tick}}"
          printf '%s' "$s"
        }
        
        format_body_as_sublist() {
          local body="$1"
          body="$(trim "$body")"
          [ -z "$body" ] && return 0
          local out=""
          local line=""
          while IFS= read -r line; do
            line="$(trim "$line")"
            [ -z "$line" ] && continue
            if [[ "$line" =~ ^\`\`\` ]]; then continue; fi
            line="$(printf '%s' "$line" | sed -E 's/^([-*+]|[0-9]+\.)[[:space:]]+//')"
            line="$(trim "$line")"
            [ -z "$line" ] && continue
            line="$(md_escape_backticks "$line")"
            out+="  - ${line}"$'\n'
          done <<< "$body"
          out="${out%$'\n'}"
          [ -n "$out" ] && printf '%s' "$out"
        }

        CC_HEADER_RE='^[a-zA-Z]+(\([^)]+\))?(!)?:'
        CC_FULL_RE='^([a-zA-Z]+)(\(([^)]+)\))?(!)?:[[:space:]]*(.+)$'
        
        TMPDIR=$(mktemp -d)
        for type in feat fix perf refactor docs chore style test build ci other; do
          : > "$TMPDIR/$type.txt"
        done
        
        while IFS= read -r -d $'\x1e' record; do
          record="${record%$'\n'}"
          [ -z "$record" ] && continue
          sha="${record%%$'\n'*}"
          rest="${record#*$'\n'}"
          subject_raw="${rest%%$'\n'*}"
          body_raw="${rest#*$'\n'}"
          sha="$(trim "$sha")"
          sha_suffix=""
          if [ -n "$sha" ]; then
            sha_suffix=" (\`${sha}\`)"
          fi
          subject_raw="$(trim "$subject_raw")"
          body_raw="${body_raw//$'\r'/}"
          subject="$(strip_inline_fence "$subject_raw")"
          body="$body_raw"
          
          if [ -z "$subject" ] || ! [[ "$subject" =~ $CC_HEADER_RE ]]; then
            new_body=""
            promoted_subject=""
            while IFS= read -r line; do
              line="$(trim "$line")"
              [ -z "$line" ] && continue
              if [[ "$line" =~ ^\`\`\` ]]; then continue; fi
              if [ -z "$promoted_subject" ] && [[ "$line" =~ $CC_HEADER_RE ]]; then
                promoted_subject="$(strip_inline_fence "$line")"
                continue
              fi
              new_body+="$line"$'\n'
            done <<< "$body_raw"
            body="$(trim "$new_body")"
            if [ -n "$promoted_subject" ]; then
              subject="$promoted_subject"
            fi
          fi
          subject="$(trim "$subject")"
          
          if [[ "$subject" =~ $CC_FULL_RE ]]; then
            TYPE="${BASH_REMATCH[1],,}"
            SCOPE="$(trim "${BASH_REMATCH[3]}")"
            DESC="$(trim "${BASH_REMATCH[5]}")"
            scope_safe="$(md_escape_backticks "$SCOPE")"
            desc_safe="$(md_escape_backticks "$DESC")"
            if [ -n "$SCOPE" ] && [ "$SCOPE" != "$TYPE" ]; then
              ENTRY="- **${scope_safe}**: ${desc_safe}${sha_suffix}"
            else
              ENTRY="- ${desc_safe}${sha_suffix}"
            fi
            body_out="$(format_body_as_sublist "$body" || true)"
            if [ -n "${body_out:-}" ]; then
              ENTRY+=$'\n'"$body_out"
            fi
            case "$TYPE" in
              feat)     printf '%s\n' "$ENTRY" >> "$TMPDIR/feat.txt" ;;
              fix)      printf '%s\n' "$ENTRY" >> "$TMPDIR/fix.txt" ;;
              perf)     printf '%s\n' "$ENTRY" >> "$TMPDIR/perf.txt" ;;
              refactor) printf '%s\n' "$ENTRY" >> "$TMPDIR/refactor.txt" ;;
              docs)     printf '%s\n' "$ENTRY" >> "$TMPDIR/docs.txt" ;;
              chore)    printf '%s\n' "$ENTRY" >> "$TMPDIR/chore.txt" ;;
              style)    printf '%s\n' "$ENTRY" >> "$TMPDIR/style.txt" ;;
              test)     printf '%s\n' "$ENTRY" >> "$TMPDIR/test.txt" ;;
              build)    printf '%s\n' "$ENTRY" >> "$TMPDIR/build.txt" ;;
              ci)       printf '%s\n' "$ENTRY" >> "$TMPDIR/ci.txt" ;;
              *)        printf '%s\n' "$ENTRY" >> "$TMPDIR/other.txt" ;;
            esac
          else
            subject_other="$(trim "$(strip_inline_fence "$subject_raw")")"
            subject_other="$(md_escape_backticks "$subject_other")"
            [ -z "$subject_other" ] && subject_other="(no subject)"
            ENTRY="- ${subject_other}${sha_suffix}"
            body_out="$(format_body_as_sublist "$body_raw" || true)"
            if [ -n "${body_out:-}" ]; then
              ENTRY+=$'\n'"$body_out"
            fi
            printf '%s\n' "$ENTRY" >> "$TMPDIR/other.txt"
          fi
        done < <(git log "$COMMIT_RANGE" --no-merges --pretty=format:'%h%n%s%n%b%n%x1e' 2>/dev/null)
        
        CHANGELOG=""
        add_section() {
          local file="$1"
          local title="$2"
          if [ -s "$file" ]; then
            CHANGELOG="${CHANGELOG}${title}"$'\n\n'
            CHANGELOG="${CHANGELOG}$(cat "$file")"$'\n\n'
          fi
        }
        
        add_section "$TMPDIR/feat.txt"     "## ✨ 新功能 (Features)"
        add_section "$TMPDIR/fix.txt"      "## 🐛 Bug 修复 (Bug Fixes)"
        add_section "$TMPDIR/perf.txt"     "## ⚡ 性能优化 (Performance)"
        add_section "$TMPDIR/refactor.txt" "## ♻️ 代码重构 (Refactoring)"
        add_section "$TMPDIR/docs.txt"     "## 📝 文档更新 (Documentation)"
        add_section "$TMPDIR/build.txt"    "## 📦 构建相关 (Build)"
        add_section "$TMPDIR/ci.txt"       "## 👷 CI 配置 (CI)"
        add_section "$TMPDIR/chore.txt"    "## 🔧 杂项 (Chores)"
        add_section "$TMPDIR/style.txt"    "## 💄 代码风格 (Style)"
        add_section "$TMPDIR/test.txt"     "## ✅ 测试 (Tests)"
        add_section "$TMPDIR/other.txt"    "## 📋 其他更新 (Other)"
        rm -rf "$TMPDIR"
        
        [ -z "$CHANGELOG" ] && CHANGELOG="暂无更新记录"
        
        DELIM="CHANGELOG_$(date +%s%N)"
        {
          printf 'body<<%s\n' "$DELIM"
          printf '%s\n' "$CHANGELOG"
          printf '%s\n' "$DELIM"
        } >> "$GITHUB_OUTPUT"

    - name: 下载打包文件
      uses: actions/download-artifact@v8
      with:
        name: release-assets-mac
        path: release-assets

    - name: 发布 GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.build-mac.outputs.release_tag }}
        name: ${{ needs.build-mac.outputs.release_tag }}
        target_commitish: ${{ github.sha }}
        files: |
          release-assets/*.zip
          release-assets/*.sha256
        fail_on_unmatched_files: true
        body: ${{ steps.changelog.outputs.body }}

    - name: 同步版本号到仓库
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        VERSION="${{ needs.build-mac.outputs.release_version }}"
        TAG="${{ needs.build-mac.outputs.release_tag }}"
        
        if [ -z "$VERSION" ]; then
          echo "::warning::版本号为空，跳过同步"
          exit 0
        fi
        
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        DEFAULT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
        git fetch origin "$DEFAULT_BRANCH" || true
        
        echo "$VERSION" > VERSION
        if git diff --quiet VERSION; then
          echo "VERSION 已是最新 ($VERSION)，无需更新"
          exit 0
        fi
        
        git add VERSION
        git commit -m "chore: 同步版本号到 $TAG [skip ci]"
        git push origin "$DEFAULT_BRANCH"
